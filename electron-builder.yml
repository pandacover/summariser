appId: com.pandacover.digest-tray
productName: Digest
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/**/*
extraResources:
  - from: resources
    to: .
win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Mac packaging is out of scope for v1 (Windows-first).
  target: []
linux:
  target: []
